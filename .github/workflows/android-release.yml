name: Release APK signé

# Distribution gratuite et versionnée, sans compte développeur payant : un tag
# `v*` construit l'APK avec la clé d'upload, vérifie la signature puis attache
# APK + AAB à une GitHub Release. C'est exactement ce que consomment Obtainium
# (mises à jour automatiques côté utilisateur) et les magasins gratuits qui
# reprennent les releases du dépôt (Uptodown, APKPure, Huawei AppGallery…).
#
# Secrets à définir une seule fois dans Settings → Secrets and variables →
# Actions (jamais dans le dépôt) :
#   ANDROID_KEYSTORE_BASE64    base64 de android/app/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword de keystore.properties
#   ANDROID_KEY_ALIAS          keyAlias de keystore.properties
#   ANDROID_KEY_PASSWORD       keyPassword de keystore.properties
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à créer (ex. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: APK + AAB signés
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TC_ROOT: ${{ github.workspace }}/.android-tc
      JAVA_HOME: ${{ github.workspace }}/.android-tc/jdk
      ANDROID_HOME: ${{ github.workspace }}/.android-tc/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-tc/sdk
    steps:
      - uses: actions/checkout@v4

      # JDK 17 + Gradle 8.9 + SDK 35 : le script du dépôt, celui qui a produit
      # l'APK publié. Le build en CI est donc identique au build local.
      - name: Outils Android (JDK 17, Gradle 8.9, SDK 35)
        run: bash scripts/setup-android-toolchain.sh

      # local.properties porte le chemin du SDK de la machine de développement :
      # sur le runner il pointerait vers un dossier inexistant et casserait le
      # build. On le retire pour laisser AGP utiliser ANDROID_HOME.
      - name: Retirer le local.properties de la machine de développement
        run: rm -f android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restaurer la clé d'upload
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name manquant : sans lui le build retomberait sur la clé de debug, refusée par les magasins."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          umask 077
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/app/keystore.properties

      - name: Tests unitaires
        run: ./.android-tc/gradle/bin/gradle -p android testDebugUnitTest --no-daemon

      - name: Build release signé
        run: ./.android-tc/gradle/bin/gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Vérifier la signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee build-certs.txt
          if grep -qi "CN=Android Debug" build-certs.txt; then
            echo "::error::L'APK est signé avec la clé de debug : la release est refusée par les magasins et casse les mises à jour."
            exit 1
          fi

      - name: Préparer les artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Ardoise.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Ardoise.aab
          (cd dist && sha256sum Ardoise.apk Ardoise.aab | tee SHA256SUMS.txt)
          echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Ardoise ${{ env.TAG }}
          body: |
            APK signé (clé d'upload) à installer sur Android 7.0 et plus, et AAB
            correspondant pour les magasins. Vérifie l'empreinte SHA-256 dans
            `SHA256SUMS.txt` avant d'installer.

            Mise à jour automatique sur le téléphone : ajoute cette page de
            releases dans Obtainium.
          generate_release_notes: true
          files: |
            dist/Ardoise.apk
            dist/Ardoise.aab
            dist/SHA256SUMS.txt
